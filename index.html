<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elsewhere</title>

<style>
:root {
    --bg: #11121d;
    --text: #f3f0f7;
    --muted: #b5b0c5;
    --accent: #d7c4f4;
    --border: rgba(255,255,255,.2);
    --glass: rgba(255,255,255,.105);
    --glass-hover: rgba(255,255,255,.16);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                 "Helvetica Neue", sans-serif;
    background:
        radial-gradient(ellipse at 12% 15%, rgba(93,105,183,.48), transparent 42%),
        radial-gradient(ellipse at 82% 8%, rgba(177,112,169,.36), transparent 40%),
        radial-gradient(ellipse at 75% 85%, rgba(224,133,111,.32), transparent 42%),
        radial-gradient(ellipse at 20% 90%, rgba(72,111,147,.35), transparent 42%),
        #11121d;
    background-attachment: fixed;
    overflow-x: hidden;
}

/* Soft Sequoia-like flowing colour shapes */
body::before {
    content: "";
    position: fixed;
    inset: -20%;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(ellipse at 35% 30%, rgba(181,160,232,.16), transparent 35%),
        radial-gradient(ellipse at 70% 50%, rgba(244,174,164,.14), transparent 36%);
    filter: blur(35px);
    animation: atmosphere 18s ease-in-out infinite alternate;
}

@keyframes atmosphere {
    from { transform: translate(-2%, -1%) scale(1); }
    to { transform: translate(2%, 2%) scale(1.08); }
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background: linear-gradient(
        135deg,
        rgba(255,255,255,.035),
        transparent 35%,
        rgba(255,255,255,.025)
    );
}

button, input, textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

.container {
    width: min(1100px, calc(100% - 40px));
    margin: 0 auto;
    padding: 55px 0 75px;
}

header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 38px;
}

.brand {
    font-size: 15px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,.75);
    font-weight: 600;
}

.clock {
    text-align: right;
}

#time {
    font-size: 25px;
    font-weight: 500;
    letter-spacing: -.7px;
}

#date {
    color: var(--muted);
    font-size: 12px;
    margin-top: 3px;
}

.intro {
    margin-bottom: 34px;
}

#greeting {
    font-size: clamp(34px, 6vw, 54px);
    font-weight: 550;
    letter-spacing: -2px;
    margin: 0 0 8px;
}

#subtitle {
    color: var(--muted);
    font-size: 15px;
    margin: 0;
}

.search-wrap {
    margin-bottom: 30px;
}

.search {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 10px 8px 19px;
    border: 1px solid var(--border);
    border-radius: 17px;
    background: rgba(255,255,255,.12);
    backdrop-filter: blur(35px) saturate(150%);
    -webkit-backdrop-filter: blur(35px) saturate(150%);
    box-shadow: 0 12px 40px rgba(0,0,0,.13),
                inset 0 1px rgba(255,255,255,.15);
}

.search input {
    flex: 1;
    min-width: 0;
    color: white;
    background: transparent;
    border: 0;
    outline: 0;
    padding: 10px 0;
    font-size: 15px;
}

.search input::placeholder {
    color: rgba(255,255,255,.58);
}

.search button,
.add-button {
    border: 1px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.16);
    color: white;
    border-radius: 11px;
    padding: 10px 16px;
    transition: .2s ease;
}

.search button:hover,
.add-button:hover {
    background: rgba(255,255,255,.25);
}

.grid {
    display: grid;
    grid-template-columns: 1.15fr .85fr;
    gap: 20px;
}

.panel {
    border: 1px solid rgba(255,255,255,.19);
    border-radius: 22px;
    padding: 23px;
    background: rgba(255,255,255,.105);
    backdrop-filter: blur(35px) saturate(155%);
    -webkit-backdrop-filter: blur(35px) saturate(155%);
    box-shadow:
        0 18px 50px rgba(0,0,0,.16),
        inset 0 1px rgba(255,255,255,.16);
    transition: background .25s ease, transform .25s ease;
}

.panel:hover {
    background: rgba(255,255,255,.13);
}

.panel h2 {
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 18px;
    letter-spacing: -.2px;
}

.bookmarks {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 11px;
}

.bookmark {
    display: flex;
    align-items: center;
    gap: 11px;
    min-width: 0;
    padding: 13px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 14px;
    color: white;
    text-decoration: none;
    background: rgba(255,255,255,.075);
    transition: .2s ease;
}

.bookmark:hover {
    background: rgba(255,255,255,.17);
    transform: translateY(-2px);
}

.bookmark-icon {
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    border-radius: 9px;
    background: rgba(255,255,255,.15);
    font-size: 15px;
}

.bookmark-name {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: 13px;
}

.delete-site {
    margin-left: auto;
    border: 0;
    color: rgba(255,255,255,.5);
    background: transparent;
    padding: 3px;
    font-size: 15px;
}

.delete-site:hover {
    color: white;
}

.add-site {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

.add-site input,
.task-input {
    min-width: 0;
    flex: 1;
    padding: 10px 12px;
    color: white;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 11px;
    outline: 0;
    background: rgba(0,0,0,.12);
}

.add-site input::placeholder,
.task-input::placeholder {
    color: rgba(255,255,255,.45);
}

.add-site input:focus,
.task-input:focus,
textarea:focus {
    border-color: rgba(218,200,255,.65);
}

.task-input {
    width: 100%;
    margin-bottom: 12px;
}

.tasks {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.task {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 11px;
    border-radius: 11px;
    background: rgba(255,255,255,.075);
    font-size: 13px;
}

.task input {
    accent-color: #c9b5ef;
}

.task span {
    flex: 1;
    overflow-wrap: anywhere;
}

.task.done span {
    opacity: .45;
    text-decoration: line-through;
}

.task-delete {
    border: 0;
    background: transparent;
    color: rgba(255,255,255,.45);
    font-size: 16px;
}

.task-delete:hover {
    color: white;
}

.notes-panel {
    grid-column: 1 / -1;
}

textarea {
    width: 100%;
    min-height: 145px;
    resize: vertical;
    padding: 14px;
    color: white;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.6;
    border: 1px solid rgba(255,255,255,.13);
    border-radius: 13px;
    outline: 0;
    background: rgba(0,0,0,.10);
}

textarea::placeholder {
    color: rgba(255,255,255,.45);
}

.note-status {
    color: var(--muted);
    font-size: 11px;
    margin-top: 9px;
    text-align: right;
}

footer {
    text-align: center;
    color: rgba(255,255,255,.4);
    font-size: 11px;
    letter-spacing: 1px;
    margin-top: 35px;
}

/* Little Spirit */
#spirit {
    position: fixed;
    right: 28px;
    bottom: 22px;
    width: 70px;
    height: 78px;
    z-index: 10;
    pointer-events: none;
    animation: spirit-float 4s ease-in-out infinite;
    filter: drop-shadow(0 8px 15px rgba(0,0,0,.2));
}

#spirit svg {
    width: 100%;
    height: 100%;
    overflow: visible;
}

@keyframes spirit-float {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-9px) rotate(2deg); }
}

.spirit-status {
    position: fixed;
    right: 108px;
    bottom: 34px;
    z-index: 10;
    color: rgba(255,255,255,.65);
    font-size: 10px;
    letter-spacing: .5px;
    pointer-events: none;
}

@media (max-width: 720px) {
    .container {
        padding-top: 30px;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .notes-panel {
        grid-column: auto;
    }

    header {
        margin-bottom: 30px;
    }

    #spirit {
        width: 54px;
        height: 60px;
        right: 15px;
        bottom: 15px;
    }

    .spirit-status {
        right: 78px;
        bottom: 27px;
    }
}

@media (max-width: 420px) {
    .bookmarks {
        grid-template-columns: 1fr;
    }

    .add-site {
        flex-wrap: wrap;
    }
}
</style>
</head>

<body>
<div class="container">

    <header>
        <div class="brand">Elsewhere</div>

        <div class="clock">
            <div id="time">--:--</div>
            <div id="date">Loading date...</div>
        </div>
    </header>

    <section class="intro">
        <h1 id="greeting">Good evening.</h1>
        <p id="subtitle">A little space of your own.</p>
    </section>

    <section class="search-wrap">
        <form class="search" id="searchForm">
            <input
                id="searchInput"
                type="text"
                placeholder="Search the internet..."
                autocomplete="off"
            >
            <button type="submit">Search ↗</button>
        </form>
    </section>

    <main class="grid">

        <section class="panel">
            <h2>Quick access</h2>

            <div class="bookmarks" id="bookmarks"></div>

            <form class="add-site" id="addSiteForm">
                <input id="siteName" placeholder="Name" required>
                <input id="siteUrl" placeholder="Website URL" required>
                <button class="add-button" type="submit">Add</button>
            </form>
        </section>

        <section class="panel">
            <h2>Tasks</h2>

            <form id="taskForm">
                <input
                    class="task-input"
                    id="taskInput"
                    placeholder="Add something to do..."
                    autocomplete="off"
                    required
                >
            </form>

            <div class="tasks" id="tasks"></div>
        </section>

        <section class="panel notes-panel">
            <h2>Notes</h2>
            <textarea
                id="notes"
                placeholder="Leave a thought here..."
            ></textarea>
            <div class="note-status" id="noteStatus">Saved locally</div>
        </section>

    </main>

    <footer>YOUR OWN LITTLE CORNER OF THE INTERNET</footer>
</div>

<div class="spirit-status" id="spiritStatus"></div>

<div id="spirit">
    <svg viewBox="0 0 140 155" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#ffffff" stop-opacity=".95"/>
                <stop offset="45%" stop-color="#dceaff" stop-opacity=".65"/>
                <stop offset="100%" stop-color="#a8c6d9" stop-opacity=".45"/>
            </linearGradient>

            <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#a8df9d"/>
                <stop offset="100%" stop-color="#438b69"/>
            </linearGradient>

            <linearGradient id="flower" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#fff2d5"/>
                <stop offset="100%" stop-color="#e6b9db"/>
            </linearGradient>

            <filter id="glow">
                <feGaussianBlur stdDeviation="4" result="blur"/>
                <feMerge>
                    <feMergeNode in="blur"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>
        </defs>

        <!-- Glass body -->
        <path
            d="M70 18
               C40 18 22 43 23 83
               C24 119 42 139 70 139
               C98 139 116 119 117 83
               C118 43 100 18 70 18Z"
            fill="url(#glass)"
            stroke="rgba(255,255,255,.9)"
            stroke-width="2"
            filter="url(#glow)"
        />

        <!-- Glass highlights -->
        <path
            d="M39 49 C43 34 53 28 63 27"
            fill="none"
            stroke="white"
            stroke-width="4"
            stroke-linecap="round"
            opacity=".65"
        />

        <path
            d="M31 80 C30 100 38 117 48 124"
            fill="none"
            stroke="white"
            stroke-width="2"
            stroke-linecap="round"
            opacity=".35"
        />

        <!-- Face -->
        <ellipse cx="53" cy="72" rx="4.5" ry="6" fill="#34444b"/>
        <ellipse cx="87" cy="72" rx="4.5" ry="6" fill="#34444b"/>
        <path
            d="M65 86 Q70 91 75 86"
            fill="none"
            stroke="#52666b"
            stroke-width="2.5"
            stroke-linecap="round"
        />

        <!-- Starfish on the right eye -->
        <g transform="translate(87 65) rotate(12)">
            <path
                d="M0 -12
                   L3 -4
                   L11 -7
                   L6 0
                   L12 5
                   L3 5
                   L0 13
                   L-3 5
                   L-11 7
                   L-6 0
                   L-12 -5
                   L-3 -5Z"
                fill="#f2a879"
                stroke="#fff0d9"
                stroke-width="1.5"
            />
            <circle cx="0" cy="0" r="2" fill="#ffe8c6"/>
        </g>

        <!-- Accessory is inserted here -->
        <g id="accessory"></g>
    </svg>
</div>

<script>
/* --------------------------------
   CLOCK AND GREETING
-------------------------------- */

function updateClock() {
    const now = new Date();

    document.getElementById("time").textContent =
        now.toLocaleTimeString("en-AU", {
            hour: "2-digit",
            minute: "2-digit"
        });

    document.getElementById("date").textContent =
        now.toLocaleDateString("en-AU", {
            weekday: "long",
            day: "numeric",
            month: "long"
        });

    const hour = now.getHours();
    let greeting = "Good evening.";

    if (hour >= 5 && hour < 12) {
        greeting = "Good morning.";
    } else if (hour >= 12 && hour < 17) {
        greeting = "Good afternoon.";
    } else if (hour >= 17 && hour < 22) {
        greeting = "Good evening.";
    } else {
        greeting = "Still awake?";
    }

    document.getElementById("greeting").textContent = greeting;
}

updateClock();
setInterval(updateClock, 1000);


/* --------------------------------
   SEARCH
-------------------------------- */

document.getElementById("searchForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const query = document.getElementById("searchInput").value.trim();

    if (query) {
        window.open(
            "https://www.google.com/search?q=" + encodeURIComponent(query),
            "_blank"
        );
    }
});


/* --------------------------------
   BOOKMARKS
-------------------------------- */

const defaultSites = [
    {
        name: "Wordle",
        url: "https://www.nytimes.com/games/wordle/index.html",
        icon: "▦"
    },
    {
        name: "Google Docs",
        url: "https://docs.google.com",
        icon: "▤"
    },
    {
        name: "ChatGPT",
        url: "https://chatgpt.com",
        icon: "✳"
    }
];

let sites = JSON.parse(localStorage.getItem("elsewhereSites")) || defaultSites;

function saveSites() {
    localStorage.setItem("elsewhereSites", JSON.stringify(sites));
}

function renderSites() {
    const container = document.getElementById("bookmarks");
    container.innerHTML = "";

    sites.forEach((site, index) => {
        const link = document.createElement("a");
        link.className = "bookmark";
        link.href = site.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        const icon = document.createElement("span");
        icon.className = "bookmark-icon";
        icon.textContent = site.icon || "↗";

        const name = document.createElement("span");
        name.className = "bookmark-name";
        name.textContent = site.name;

        const remove = document.createElement("button");
        remove.className = "delete-site";
        remove.type = "button";
        remove.textContent = "×";
        remove.title = "Remove bookmark";

        remove.addEventListener("click", function(event) {
            event.preventDefault();
            event.stopPropagation();

            sites.splice(index, 1);
            saveSites();
            renderSites();
        });

        link.append(icon, name, remove);
        container.appendChild(link);
    });
}

document.getElementById("addSiteForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const name = document.getElementById("siteName").value.trim();
    let url = document.getElementById("siteUrl").value.trim();

    if (!name || !url) return;

    if (!/^https?:\/\//i.test(url)) {
        url = "https://" + url;
    }

    sites.push({
        name: name,
        url: url,
        icon: "↗"
    });

    saveSites();
    renderSites();

    this.reset();
});

renderSites();


/* --------------------------------
   TASKS
-------------------------------- */

let tasks = JSON.parse(localStorage.getItem("elsewhereTasks")) || [];

function saveTasks() {
    localStorage.setItem("elsewhereTasks", JSON.stringify(tasks));
}

function renderTasks() {
    const container = document.getElementById("tasks");
    container.innerHTML = "";

    tasks.forEach((task, index) => {
        const row = document.createElement("div");
        row.className = "task" + (task.done ? " done" : "");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;

        checkbox.addEventListener("change", function() {
            tasks[index].done = checkbox.checked;
            saveTasks();
            renderTasks();
        });

        const text = document.createElement("span");
        text.textContent = task.text;

        const remove = document.createElement("button");
        remove.className = "task-delete";
        remove.type = "button";
        remove.textContent = "×";
        remove.title = "Delete task";

        remove.addEventListener("click", function() {
            tasks.splice(index, 1);
            saveTasks();
            renderTasks();
        });

        row.append(checkbox, text, remove);
        container.appendChild(row);
    });
}

document.getElementById("taskForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const input = document.getElementById("taskInput");
    const text = input.value.trim();

    if (!text) return;

    tasks.push({
        text: text,
        done: false
    });

    saveTasks();
    renderTasks();
    input.value = "";
});

renderTasks();


/* --------------------------------
   NOTES
-------------------------------- */

const notes = document.getElementById("notes");
const noteStatus = document.getElementById("noteStatus");

notes.value = localStorage.getItem("elsewhereNotes") || "";

notes.addEventListener("input", function() {
    localStorage.setItem("elsewhereNotes", notes.value);
    noteStatus.textContent = "Saved";
});


/* --------------------------------
   LITTLE SPIRIT
-------------------------------- */

const accessory = document.getElementById("accessory");
const spiritStatus = document.getElementById("spiritStatus");

function bulb() {
    return `
        <g transform="translate(70 22)">
            <path
                d="M0 0 C-12 -10 -22 1 -18 13
                   C-16 19 -10 21 -9 28
                   L9 28
                   C10 21 16 19 18 13
                   C22 1 12 -10 0 0Z"
                fill="#ffe8a6"
                stroke="#fff4d1"
                stroke-width="2"
                filter="url(#glow)"
            />
            <path
                d="M-8 29 L8 29 M-7 34 L7 34 M-5 39 L5 39"
                stroke="#d5b77e"
                stroke-width="3"
                stroke-linecap="round"
            />
            <path
                d="M0 -9 L0 -16 M-23 1 L-29 -3 M23 1 L29 -3"
                stroke="#ffe8a6"
                stroke-width="2"
                stroke-linecap="round"
            />
        </g>
    `;
}

function sprout() {
    return `
        <g transform="translate(70 18)">
            <path
                d="M0 30 Q0 7 0 -5"
                stroke="#6a9d67"
                stroke-width="4"
                stroke-linecap="round"
                fill="none"
            />
            <path
                d="M0 11 C-25 8 -29 -13 -8 -17
                   C2 -12 4 0 0 11Z"
                fill="url(#green)"
                stroke="#c5e8a9"
                stroke-width="1.5"
            />
            <path
                d="M0 3 C14 -20 33 -11 27 4
                   C20 17 7 17 0 11Z"
                fill="#8fbd81"
                stroke="#d0edb5"
                stroke-width="1.5"
            />
            <path
                d="M-15 -9 Q-7 -5 0 11 M22 -5 Q12 1 0 11"
                fill="none"
                stroke="#d9efc5"
                stroke-width="1.5"
            />
        </g>
    `;
}

function queenOfTheNight() {
    return `
        <g transform="translate(70 22)" filter="url(#glow)">
            <path
                d="M0 14
                   C-25 12 -29 -9 -12 -14
                   C-8 -27 7 -25 12 -14
                   C30 -11 25 12 0 14Z"
                fill="url(#flower)"
                stroke="#fff1ed"
                stroke-width="1.5"
            />
            <path
                d="M0 14
                   C-10 0 -22 -2 -19 -15
                   C-7 -18 0 -7 0 14Z"
                fill="#f8d9e9"
                stroke="#fff1ed"
                stroke-width="1"
            />
            <path
                d="M0 14
                   C10 0 22 -2 19 -15
                   C7 -18 0 -7 0 14Z"
                fill="#f1c9e4"
                stroke="#fff1ed"
                stroke-width="1"
            />
            <circle cx="0" cy="5" r="5" fill="#f7d58c"/>
            <path
                d="M0 19 Q0 31 0 38"
                stroke="#78a777"
                stroke-width="3"
                fill="none"
                stroke-linecap="round"
            />
            <path
                d="M0 29 Q-15 18 -19 29 Q-9 36 0 29Z"
                fill="#77a978"
            />
        </g>
    `;
}

let currentAccessory = "";

function updateAccessory() {
    const hour = new Date().getHours();
    let nextAccessory;
    let status;

    if (hour >= 0 && hour < 6) {
        nextAccessory = "bulb";
        status = "Resting";
    } else if (hour >= 6 && hour < 13) {
        nextAccessory = "sprout";
        status = "Growing";
    } else {
        nextAccessory = "flower";
        status = "In bloom";
    }

    if (nextAccessory === currentAccessory) return;

    currentAccessory = nextAccessory;

    if (nextAccessory === "bulb") {
        accessory.innerHTML = bulb();
    } else if (nextAccessory === "sprout") {
        accessory.innerHTML = sprout();
    } else {
        accessory.innerHTML = queenOfTheNight();
    }

    spiritStatus.textContent = status;
}

updateAccessory();
setInterval(updateAccessory, 60000);
</script>
</body>
</html>
