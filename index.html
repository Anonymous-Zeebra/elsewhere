
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elsewhere — Personal Dashboard</title>

<style>
:root {
    --bg: #101a19;
    --panel: rgba(35, 53, 47, .66);
    --panel-hover: rgba(48, 70, 60, .8);
    --border: rgba(190, 220, 197, .14);
    --text: #e5eee5;
    --muted: #9aafa1;
    --accent: #b2d1b5;
    --accent2: #d3b9d9;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    padding: 35px;
    background:
        radial-gradient(ellipse at 15% 10%, #243c32 0%, transparent 45%),
        radial-gradient(ellipse at 90% 85%, #25313b 0%, transparent 45%),
        var(--bg);
    color: var(--text);
    font-family: "SF Pro Display", "Segoe UI", sans-serif;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
        linear-gradient(rgba(200,230,205,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(200,230,205,.025) 1px, transparent 1px);
    background-size: 48px 48px;
}

main {
    max-width: 1100px;
    margin: auto;
    position: relative;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    padding-bottom: 19px;
    margin-bottom: 36px;
}

.logo {
    font-size: 17px;
    letter-spacing: 5px;
    font-weight: 650;
}

.logo span { color: var(--accent); }

.header-right {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 1.5px;
}

.hero {
    display: flex;
    justify-content: space-between;
    align-items: end;
    margin-bottom: 30px;
}

h1 {
    font-size: clamp(32px, 5vw, 48px);
    font-weight: 400;
    letter-spacing: -2px;
    margin: 8px 0;
}

.subtitle {
    color: var(--muted);
    font-size: 12px;
}

.clock {
    color: var(--accent);
    font-size: 32px;
    font-weight: 300;
    font-variant-numeric: tabular-nums;
}

.date {
    text-align: right;
    margin-top: 5px;
}

.panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 15px;
    padding: 22px;
    backdrop-filter: blur(20px);
    box-shadow: 0 12px 35px rgba(0,0,0,.12);
    min-width: 0;
    transition: background .2s, border-color .2s;
}

.panel:hover {
    background: var(--panel-hover);
    border-color: rgba(190,220,197,.25);
}

.section-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 19px;
}

.section-title {
    font-size: 11px;
    font-weight: 650;
    letter-spacing: 2px;
    color: var(--accent);
}

.section-number {
    color: var(--muted);
    font-size: 10px;
}

.search-panel {
    margin-bottom: 19px;
}

.search-row {
    display: flex;
    gap: 10px;
}

input, textarea {
    width: 100%;
    padding: 12px;
    color: var(--text);
    background: rgba(10,20,17,.55);
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
    font-family: inherit;
    font-size: 13px;
}

input:focus, textarea:focus {
    border-color: var(--accent);
}

button {
    color: var(--accent);
    background: rgba(178,209,181,.09);
    border: 1px solid var(--border);
    padding: 10px 14px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    background: rgba(178,209,181,.2);
    border-color: var(--accent);
}

.grid {
    display: grid;
    grid-template-columns: 1.15fr .85fr;
    gap: 19px;
}

.full { grid-column: 1 / -1; }

.sites {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 11px;
}

.site {
    min-width: 0;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 9px;
    min-height: 105px;
    padding: 14px 7px;
    color: var(--text);
    text-decoration: none;
    background: rgba(255,255,255,.025);
    border: 1px solid var(--border);
    border-radius: 11px;
    transition: .2s;
}

.site:hover {
    background: rgba(178,209,181,.12);
    transform: translateY(-3px);
}

.site-icon {
    font-size: 25px;
}

.site-name {
    font-size: 12px;
    text-align: center;
    overflow-wrap: anywhere;
}

.site-remove {
    position: absolute;
    top: 4px;
    right: 4px;
    padding: 2px 6px;
    opacity: 0;
    font-size: 11px;
    border: none;
    background: rgba(0,0,0,.3);
}

.site:hover .site-remove { opacity: 1; }

.add-site {
    margin-top: 14px;
    width: 100%;
}

#siteForm {
    display: none;
    grid-template-columns: 1fr 1fr auto;
    gap: 8px;
    margin-top: 13px;
}

#siteForm.visible { display: grid; }

textarea {
    min-height: 180px;
    resize: vertical;
    line-height: 1.8;
}

.save-status {
    margin-top: 10px;
    color: var(--muted);
    font-size: 10px;
}

.task-entry {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
}

.task-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.task {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
}

.task input {
    width: 15px;
    height: 15px;
    accent-color: #b2d1b5;
}

.task span { flex: 1; }

.task.done span {
    color: var(--muted);
    text-decoration: line-through;
}

.task button {
    padding: 3px 8px;
    border: none;
    opacity: .6;
}

.empty {
    color: var(--muted);
    font-size: 12px;
    padding: 8px 0;
}

footer {
    text-align: center;
    color: #81958a;
    font-size: 10px;
    letter-spacing: 2px;
    padding: 32px 0 10px;
}

/* LITTLE SPIRIT */

#spirit {
    position: fixed;
    left: 70%;
    top: 25%;
    width: 65px;
    height: 72px;
    z-index: 10;
    pointer-events: none;
    transition:
        left 5s cubic-bezier(.35,.05,.45,1),
        top 5s cubic-bezier(.35,.05,.45,1);
    filter: drop-shadow(0 5px 12px rgba(155,220,190,.2));
}

#spirit .spirit-art {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
    animation: float 4s ease-in-out infinite;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
}

.accessory {
    transform-origin: 70px 20px;
    animation: grow-in 1.1s ease both;
}

@keyframes grow-in {
    from {
        opacity: 0;
        transform: translateY(7px) scale(.75);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

#spirit-status {
    color: var(--muted);
    font-size: 10px;
}

@media(max-width: 700px) {
    body { padding: 18px; }
    .grid { grid-template-columns: 1fr; }
    .full { grid-column: 1; }
    .sites { grid-template-columns: repeat(2,1fr); }
    .hero { align-items: start; }
    .clock { font-size: 24px; }
    #siteForm { grid-template-columns: 1fr; }
    #spirit { width: 52px; height: 58px; }
}
</style>
</head>

<body>

<!-- THE LITTLE SPIRIT -->
<div id="spirit">
<svg class="spirit-art" viewBox="0 0 140 155"
     xmlns="http://www.w3.org/2000/svg">

<defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">

        <stop offset="45%" stop-color="#a8d9ed" stop-opacity=".78"/>
        <stop offset="100%" stop-color="#6bafd0" stop-opacity=".88"/>
    </linearGradient>

    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">

<!-- Soft glow -->

<path d="
M70 18 C40 18 20 39 20 68 L20 103

L120 68 C120 39 100 18 70 18 Z"
fill="url(#glass)"/>

<!-- Frosted highlights -->
<ellipse cx="48" cy="48" rx="17" ry="24"
         fill="white" opacity=".12"/>

<path d="M30 76 Q35 40 61 25"
      fill="none" stroke="white"

<!-- Face -->
<circle cx="53" cy="72" r="3" fill="#355c73"/>
<circle cx="87" cy="72" r="3" fill="#355c73"/>
<ellipse cx="70" cy="86" rx="2.5" ry="2"
         fill="#355c73"/>

<!-- Starfish: stays on the right eye -->
<g transform="translate(87 65) rotate(12)">
    <ellipse cx="1" cy="2" rx="15" ry="14"
             fill="#9c625b" opacity=".18"/>
    <path d="
    M0 -13
    C2 -13 3 -7 5 -5
    C7 -5 13 -7 14 -4
    C15 -1 9 2 8 4
    C9 7 11 12 8 14
    C5 15 2 9 0 8
    C-3 10 -7 14 -10 12
    C-12 10 -8 5 -8 2
    C-11 0 -16 -2 -15 -5
    C-14 -8 -8 -6 -5 -6
    C-4 -9 -3 -13 0 -13 Z"
    fill="url(#starfish)"
    stroke="#d98770" stroke-width=".8"/>

    <circle cx="-4" cy="-3" r="1.2" fill="#ffe7c8"/>
    <circle cx="5" cy="1" r="1.1" fill="#ffe7c8"/>
    <circle cx="1" cy="6" r=".9" fill="#ffe7c8"/>
</g>

<!-- Time-dependent accessory -->
<g id="accessory"></g>

</svg>
</div>

<main>

<header>
    <div class="logo">ELSEWHERE<span> .</span></div>
    <div class="header-right" id="spirit-status">A LITTLE WORLD OF YOUR OWN</div>
</header>

<section class="hero">
    <div>
        <div class="subtitle">YOUR PERSONAL SPACE</div>
        <h1 id="greeting">Good evening.</h1>
        <div class="subtitle">A little space to think.</div>
    </div>

    <div>
        <div class="clock" id="clock">00:00</div>
        <div class="subtitle date" id="date"></div>
    </div>
</section>

<!-- SEARCH -->
<section class="panel search-panel">
    <div class="section-heading">
        <div class="section-title">SEARCH</div>
        <div class="section-number">01</div>
    </div>

    <form class="search-row" id="searchForm">
        <input id="search" placeholder="What are you looking for?" autocomplete="off">
        <button type="submit">SEARCH ↗</button>
    </form>
</section>

<div class="grid">

    <!-- WEBSITES -->
    <section class="panel full">
        <div class="section-heading">
            <div class="section-title">QUICK ACCESS</div>
            <div class="section-number">02 / BOOKMARKS</div>
        </div>

        <div class="sites" id="sites"></div>

        <button class="add-site" id="toggleSiteForm">+ ADD A WEBSITE</button>

        <form id="siteForm">
            <input id="siteName" placeholder="Website name" required>
            <input id="siteUrl" placeholder="Website URL" required>
            <button type="submit">ADD</button>
        </form>
    </section>

    <!-- TASKS -->
    <section class="panel">
        <div class="section-heading">
            <div class="section-title">TASKS</div>
            <div class="section-number">03</div>
        </div>

        <form class="task-entry" id="taskForm">
            <input id="taskInput" placeholder="Add something to do..." required>
            <button type="submit">+</button>
        </form>

        <div class="task-list" id="taskList"></div>
    </section>

    <!-- NOTES -->
    <section class="panel">
        <div class="section-heading">
            <div class="section-title">NOTES & THOUGHTS</div>
            <div class="section-number">04 / MEMORY</div>
        </div>

        <textarea id="notes" placeholder="Write something down..."></textarea>
        <div class="save-status" id="saveStatus">READY</div>
    </section>

</div>

<footer>
    ELSEWHERE · YOUR OWN LITTLE CORNER OF THE INTERNET
</footer>

</main>

<script>

// STORAGE
function load(key, fallback) {
    try {
        const value = localStorage.getItem(key);
        return value === null ? fallback : JSON.parse(value);
    } catch {
        return fallback;
    }
}

function save(key, value) {
    localStorage.setItem(key, JSON.stringify(value));
}

// CLOCK AND GREETING
function updateTime() {
    const now = new Date();
    const hour = now.getHours();

    document.getElementById("clock").textContent =
        now.toLocaleTimeString("en-AU", {
            hour: "2-digit",
            minute: "2-digit",
            hour12: false
        });

    document.getElementById("date").textContent =
        now.toLocaleDateString("en-AU", {
            weekday: "long",
            day: "numeric",
            month: "long"
        });

    let greeting = "Good evening.";
    if (hour < 12) greeting = "Good morning.";
    else if (hour < 17) greeting = "Good afternoon.";

    document.getElementById("greeting").textContent = greeting;
}

updateTime();
setInterval(updateTime, 1000);


// SEARCH
document.getElementById("searchForm").addEventListener("submit", e => {
    e.preventDefault();

    const query = document.getElementById("search").value.trim();

    if (query) {
        window.open(
            "https://www.google.com/search?q=" +
            encodeURIComponent(query),
            "_blank",
            "noopener"
        );
    }
});


// QUICK ACCESS
const defaultSites = [
    {name: "Knoxi", url: "https://knoxi.au", icon: "✳"},
    {name: "Wordle", url: "https://www.nytimes.com/games/wordle/index.html", icon: "▦"},
    {name: "Google Docs", url: "https://docs.google.com/document/u/0/", icon: "▤"},
    {name: "ChatGPT", url: "https://chatgpt.com", icon: "✧"}
];

let sites = load("elsewhereSites", defaultSites);

function renderSites() {
    const container = document.getElementById("sites");
    container.replaceChildren();

    sites.forEach((site, index) => {
        const link = document.createElement("a");
        link.className = "site";
        link.href = site.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        const icon = document.createElement("div");
        icon.className = "site-icon";
        icon.textContent = site.icon || "↗";

        const name = document.createElement("div");
        name.className = "site-name";
        name.textContent = site.name;

        const remove = document.createElement("button");
        remove.className = "site-remove";
        remove.textContent = "×";
        remove.type = "button";
        remove.title = "Remove website";

        remove.addEventListener("click", e => {
            e.preventDefault();
            e.stopPropagation();

            sites.splice(index, 1);
            save("elsewhereSites", sites);
            renderSites();
        });

        link.append(icon, name, remove);
        container.appendChild(link);
    });
}

document.getElementById("toggleSiteForm").onclick = () => {
    const form = document.getElementById("siteForm");
    form.classList.toggle("visible");

    if (form.classList.contains("visible")) {
        document.getElementById("siteName").focus();
    }
};

document.getElementById("siteForm").addEventListener("submit", e => {
    e.preventDefault();

    const name = document.getElementById("siteName").value.trim();
    let url = document.getElementById("siteUrl").value.trim();

    if (!/^https?:\/\//i.test(url)) {
        url = "https://" + url;
    }

    try {
        const parsed = new URL(url);

        if (!["http:", "https:"].includes(parsed.protocol)) {
            throw new Error("Invalid protocol");
        }

        sites.push({
            name,
            url: parsed.href,
            icon: "↗"
        });

        save("elsewhereSites", sites);
        renderSites();

        document.getElementById("siteForm").reset();
        document.getElementById("siteForm").classList.remove("visible");

    } catch {
        alert("Please enter a valid website address.");
    }
});

renderSites();


// TASKS
let tasks = load("elsewhereTasks", []);

function renderTasks() {
    const list = document.getElementById("taskList");
    list.replaceChildren();

    if (tasks.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Nothing on the list. Enjoy the peace.";
        list.appendChild(empty);
        return;
    }

    tasks.forEach((task, index) => {
        const row = document.createElement("div");
        row.className = "task" + (task.done ? " done" : "");

        const check = document.createElement("input");
        check.type = "checkbox";
        check.checked = task.done;

        check.addEventListener("change", () => {
            tasks[index].done = check.checked;
            save("elsewhereTasks", tasks);
            renderTasks();
        });

        const label = document.createElement("span");
        label.textContent = task.text;

        const remove = document.createElement("button");
        remove.textContent = "×";
        remove.title = "Delete task";

        remove.addEventListener("click", () => {
            tasks.splice(index, 1);
            save("elsewhereTasks", tasks);
            renderTasks();
        });

        row.append(check, label, remove);
        list.appendChild(row);
    });
}

document.getElementById("taskForm").addEventListener("submit", e => {
    e.preventDefault();

    const input = document.getElementById("taskInput");
    const text = input.value.trim();

    if (!text) return;

    tasks.push({text, done: false});
    save("elsewhereTasks", tasks);

    input.value = "";
    renderTasks();
});

renderTasks();


// NOTES
const notes = document.getElementById("notes");

notes.value = localStorage.getItem("elsewhereNotes") || "";

notes.addEventListener("input", () => {
    localStorage.setItem("elsewhereNotes", notes.value);
    document.getElementById("saveStatus").textContent =
        "SAVED AUTOMATICALLY";
});


// MASCOT ACCESSORY LIFE CYCLE
const accessory = document.getElementById("accessory");

function updateAccessory() {
    const now = new Date();
    const hour = now.getHours();

    let design;

    if (hour >= 0 && hour < 6) {
        design = bulb();
    } else if (hour >= 6 && hour < 13) {
        design = sprout();
    } else {
        design = queenOfTheNight();
    }

    // Only redraw when the accessory actually changes.
    if (accessory.dataset.design !== design.name) {
        accessory.innerHTML = design.svg;
        accessory.dataset.design = design.name;
    }

    const status = document.getElementById("spirit-status");

    if (design.name === "bulb") {
        status.textContent = "RESTING IN ITS BULB";
    } else if (design.name === "sprout") {
        status.textContent = "A LITTLE SPROUT";
    } else {
        status.textContent = "QUEEN OF THE NIGHT";
    }
}

function bulb() {
    return {
        name: "bulb",
        svg: `
        <g class="accessory">
            <path d="M70 20 Q70 13 70 8"
                  stroke="#668b54" stroke-width="2.5"
                  fill="none" stroke-linecap="round"/>

            <path d="
            M70 9
            C58 8 57 -2 70 -5
            C83 -2 82 8 70 9 Z"
            fill="url(#green)" stroke="#5b965e"
            stroke-width=".7"/>

            <path d="M70 8 L70 13"
                  stroke="#668b54" stroke-width="2"
                  stroke-linecap="round"/>
        </g>`
    };
}

function sprout() {
    return {
        name: "sprout",
        svg: `
        <g class="accessory">
            <path d="M70 22 Q70 12 70 3"
                  stroke="#548d58" stroke-width="3"
                  fill="none" stroke-linecap="round"/>

            <path d="
            M70 12
            C57 12 52 4 55 0
            C64 -1 70 4 70 12 Z"
            fill="url(#green)"/>

            <path d="
            M70 8
            C72 -1 82 -5 88 -1
            C87 7 79 12 70 8 Z"
            fill="url(#green)"/>
        </g>`
    };
}

function queenOfTheNight() {
    return {
        name: "flower",
        svg: `
        <g class="accessory">
            <!-- Stem -->
            <path d="M70 22 Q70 14 70 9"
                  stroke="#548d58" stroke-width="2.5"
                  fill="none" stroke-linecap="round"/>

            <!-- Sepals -->
            <path d="M70 13 Q61 8 59 4 Q68 5 70 13"
                  fill="#8eae79"/>
            <path d="M70 13 Q79 8 81 4 Q72 5 70 13"
                  fill="#8eae79"/>

            <!-- Outer petals -->
            <path d="M70 8
                     C60 3 55 -4 60 -10
                     C66 -12 69 -4 70 8"
                  fill="url(#flower)" stroke="#dedacb" stroke-width=".5"/>

            <path d="M70 8
                     C80 3 85 -4 80 -10
                     C74 -12 71 -4 70 8"
                  fill="url(#flower)" stroke="#dedacb" stroke-width=".5"/>

            <path d="M70 8
                     C59 8 49 2 53 -5
                     C61 -8 68 0 70 8"
                  fill="url(#flower)" stroke="#dedacb" stroke-width=".5"/>

            <path d="M70 8
                     C81 8 91 2 87 -5
                     C79 -8 72 0 70 8"
                  fill="url(#flower)" stroke="#dedacb" stroke-width=".5"/>

            <!-- Inner petals -->
            <path d="M70 8
                     C64 2 63 -7 70 -12
                     C77 -7 76 2 70 8"
                  fill="#fffef5" stroke="#e4dfd1" stroke-width=".5"/>

            <!-- Centre -->
            <circle cx="70" cy="6" r="2.2" fill="#e9d9a0"/>

            <!-- Stamens -->
            <g stroke="#d6b76c" stroke-width=".8"
               stroke-linecap="round">
                <path d="M70 6 L70 -5"/>
                <path d="M70 6 L64 -3"/>
                <path d="M70 6 L76 -3"/>
                <path d="M70 6 L61 1"/>
                <path d="M70 6 L79 1"/>
            </g>

            <g fill="#d6b76c">
                <circle cx="70" cy="-5" r="1.1"/>
                <circle cx="64" cy="-3" r="1.1"/>
                <circle cx="76" cy="-3" r="1.1"/>
                <circle cx="61" cy="1" r="1.1"/>
                <circle cx="79" cy="1" r="1.1"/>
            </g>
        </g>`
    };
}

// Check immediately, then every minute.
updateAccessory();
setInterval(updateAccessory, 60000);


// RANDOM FLOATING MOVEMENT
const spirit = document.getElementById("spirit");

function moveSpirit() {
    const margin = 35;
    const spiritWidth = spirit.offsetWidth;
    const spiritHeight = spirit.offsetHeight;

    const maxX = Math.max(margin, window.innerWidth - spiritWidth - margin);
    const maxY = Math.max(margin, window.innerHeight - spiritHeight - margin);

    const x = margin + Math.random() * (maxX - margin);
    const y = margin + Math.random() * (maxY - margin);

    spirit.style.left = x + "px";
    spirit.style.top = y + "px";

    spirit.style.transitionDuration =
        (4 + Math.random() * 5) + "s";
}

moveSpirit();

function scheduleSpirit() {
    const delay = 4500 + Math.random() * 5500;

    setTimeout(() => {
        moveSpirit();
        scheduleSpirit();
    }, delay);
}

scheduleSpirit();

window.addEventListener("resize", moveSpirit);

</script>
